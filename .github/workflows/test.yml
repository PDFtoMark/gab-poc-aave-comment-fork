name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact with attacker-controlled file names
        run: |
          set -e
          mkdir -p out
          printf '%s\n' "${{ github.event.pull_request.number }}" > out/pr_number.txt
          echo "benign report" > out/report.txt
          echo payload > 'out/$(id).txt'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out
